# Job-source catalog (v1)
#
# Versioned, provenance-tracked inventory of sources the personal job agent
# MAY discover jobs through. Selection is deterministic (see catalog.py) and
# happens by career track; NO scraping, browser automation, or API keys are
# implied by this file's existence.
#
# Provenance: primary community index consulted at retrieval time is
# emredurukn/awesome-job-boards. Entries are a curated, conservative subset;
# categories and flags are maintained by this repository. Disabled entries
# are retained with a `reason` so the registry documents deliberate exclusions
# (bot-hostile / ToS-bound sites are never probed).
#
# Field notes:
#   source_type   = ats | structured_data | search_engine | feed | direct | browser | restricted
#   discovery_method = ats_api | jsonld | rss_json | search_engine | browser | restricted
#   query_host    = the `site:` host used for search-engine discovery ("" => plain query)
#   rate_limit_class = low | medium | high   (drives pacing, never infinite loops)
version: "1"
provenance:
  repository: "https://github.com/emredurukn/awesome-job-boards"
  license: "CC0-1.0"
  retrieved: "2026-09-18"
  note: "Curated subset; per-entry accuracy verified by this repository."
