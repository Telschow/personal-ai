[project]
name = "personal-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=1.9",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0.3",
    "regex>=2026.9.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "types-PyYAML>=6.0.12",
    "types-regex>=2026.9.10",
]

[tool.mypy]
python_version = "3.12"
files = ["src/personal_ai"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
