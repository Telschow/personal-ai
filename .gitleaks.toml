title = "personal-ai gitleaks config"

[extend]
# Keep every default rule and add the project rule below.
useDefault = true

[[rules]]
id = "freellmapi-key"
description = "freellmapi API key"
# The key prefix followed by a long token. The environment variable name
# FREELLMAPI_API_KEY is upper case with underscores and does not match.
regex = '''freellmapi-[A-Za-z0-9_\-]{16,}'''
keywords = ["freellmapi-"]
tags = ["key", "freellmapi"]

[allowlist]
# Detection tests contain synthetic secret-shaped strings on purpose.
# tests/test_privacy_regression.py scans this path for the freellmapi key shape
# separately, so it is not a blind spot for that rule. The singular
# [allowlist] table is used because gitleaks 8.24.x (the version the action
# installs) ignores the plural [[allowlists]] form.
description = "Synthetic secret-shaped strings used on purpose in tests"
paths = [
  '''(^|/)tests/''',
]
