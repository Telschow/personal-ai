name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # The action lists a pull request's commits through the API.
  pull-requests: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Scan the full history so a secret removed in a later commit is
          # still detected.
          fetch-depth: 0

      # Uses .gitleaks.toml at the repository root: the default ruleset plus a
      # custom rule for the freellmapi- key shape.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          # Required by the action to scan pull requests.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
