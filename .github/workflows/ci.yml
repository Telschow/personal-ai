name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'uv'

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Ruff check
        run: uv run ruff check src tests job_agent

      - name: Ruff format check
        run: uv run ruff format --check src tests job_agent

      - name: MyPy
        run: uv run --with mypy mypy src/personal_ai/__init__.py

      - name: Pytest
        run: uv run pytest -m "not integration"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pip-audit
        run: pipx install pip-audit

      - name: Run pip-audit
        run: pip-audit

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.19.1
        with:
          format: cyclonedx-json
          output-file: sbom.json
        continue-on-error: true

  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
